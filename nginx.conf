events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    server {
        listen 80;
        server_name admin.jchengroa.com;
        root /usr/share/nginx/html;
        index admin.html;

        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public";
        }

        location / {
            try_files $uri $uri/ /admin.html;
        }
    }

    server {
        listen 80 default_server;
        server_name jchengroa.com www.jchengroa.com _;
        root /usr/share/nginx/html;
        index index.html;

        # Keep /admin redirecting to admin.jchengroa.com
        location = /admin {
            return 301 https://admin.jchengroa.com/;
        }
        location = /admin/ {
            return 301 https://admin.jchengroa.com/;
        }

        # Cache static assets
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public";
        }

        # React Router fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
