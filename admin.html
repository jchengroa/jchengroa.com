<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jchengroa Admin</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <meta name="description"
        content="jchengroa Admin Dashboard for controlling website content, projects, research, and configuration.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        // Apply theme immediately to prevent flash
        (function() {
            try {
                const saved = localStorage.getItem('darkMode') || localStorage.getItem('themeMode');
                if (saved === 'dark' || saved === 'true' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
</head>

<body class="font-['Outfit',sans-serif] bg-slate-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/admin/main.jsx"></script>
</body>

</html>
