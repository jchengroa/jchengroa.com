<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jchengroa</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="canonical" href="https://jchengroa.com/">
    <meta name="author" content="John Carlo Cheng Roa">
    <meta name="description"
        content="Personal website of John Carlo Cheng Roa, featuring software development projects and contact information.">
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)">

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jchengroa.com/">
    <meta property="og:title" content="John Carlo Cheng Roa — Portfolio">
    <meta property="og:description" content="Personal portfolio and showcase of projects, research, and technical work by John Carlo Cheng Roa.">
    <meta property="og:image" content="/logo.png">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="John Carlo Cheng Roa — Portfolio">
    <meta name="twitter:description" content="Personal portfolio and showcase of projects, research, and technical work by John Carlo Cheng Roa.">
    <meta name="twitter:image" content="/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        // Apply theme immediately to prevent flash
        (function() {
            try {
                const saved = localStorage.getItem('darkMode');
                if (saved !== null) {
                    if (JSON.parse(saved)) {
                        document.documentElement.classList.add('dark');
                    }
                }
            } catch (e) {}
        })();
    </script>
</head>

<body class="font-['Outfit',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
